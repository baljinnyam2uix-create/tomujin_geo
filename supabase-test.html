<!doctype html><html lang="mn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Supabase Test</title><style>body{font-family:system-ui;margin:40px;max-width:760px}.ok{color:#087f5b}.bad{color:#c92a2a}code{background:#f1f3f5;padding:2px 6px;border-radius:6px}</style></head><body><h1>Tomujin LMS — Supabase холболтын тест</h1><div id="out">Шалгаж байна...</div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/config.js"></script><script src="/backend.js"></script><script>(async()=>{const o=document.getElementById('out');try{const mode=window.GeoBackend?.mode;if(mode!=='supabase')throw new Error('GeoBackend mode = '+mode);const r=await window.GeoBackend.client.auth.getSession();if(r.error)throw r.error;o.innerHTML='<p class="ok"><b>Амжилттай:</b> GeoBackend.mode = <code>supabase</code></p><p>Supabase client ачаалсан. Одоо /auth дээр шинэ test хэрэглэгч бүртгэж Authentication → Users дээр шалгана.</p>'}catch(e){o.innerHTML='<p class="bad"><b>Алдаа:</b> '+String(e.message||e)+'</p>'}})()</script></body></html>
